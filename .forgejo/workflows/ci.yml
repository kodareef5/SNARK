# `bun run ci` on every push: the pushed commit, written out clean, installed from the lockfile and checked. A push to main,
# a run from the Actions tab and the nightly run add the slow tier. No step uses an action, so nothing is fetched from
# GitHub or a marketplace. planning/ci.md says what this needs of the runner and how to set one up.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  ci:
    # The label the runner is registered with in planning/ci.md. The job brings its own image.
    runs-on: docker
    container:
      image: docker.io/library/node:24-bookworm
    timeout-minutes: 30
    steps:
      - name: Check out the commit with git
        env:
          TOKEN: ${{ forge.token }}
        run: |
          git init --quiet .
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraHeader="Authorization: Basic $auth" fetch --quiet --depth 1 "${FORGEJO_SERVER_URL%/}/$FORGEJO_REPOSITORY.git" "$FORGEJO_SHA"
          git checkout --quiet --detach FETCH_HEAD

      - name: Install the Bun that package.json pins
        run: |
          version=$(node -p 'require("./package.json").engines.bun')
          npm install --global --prefix "$RUNNER_TEMP/bun" --no-fund --no-audit --allow-scripts=bun "bun@$version"
          echo "$RUNNER_TEMP/bun/bin" >> "$FORGEJO_PATH"

      - name: bun run ci
        env:
          EVENT: ${{ forge.event_name }}
          REF: ${{ forge.ref }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ]; then bun run ci; else bun run ci -- --slow; fi
