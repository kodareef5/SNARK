<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SNARK admin: Cast</title>
    <style>
      /* face */
      :root { --ink: #dbe8f3; --dim: #93a9bd; --faint: #5f778c; --edge: rgba(168, 204, 234, 0.22); --ice: #a9d6f2; --well: #8fd9c4; --warn: #ecb048; --bad: #ec6a52;
        font: 15px/1.35 "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; font-variant-numeric: tabular-nums; color: var(--ink); background: #08111c; }
      * { box-sizing: border-box; }
      body { margin: 0; background: radial-gradient(120% 80% at 18% -10%, #21405f 0%, #102136 46%, #08111c 100%) fixed; min-height: 100vh; }
      a { color: var(--ice); }
      h1, h2 { font-weight: 500; margin: 0; letter-spacing: 0.02em; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--dim); margin-bottom: 8px; }
      button, input, select { font: inherit; color: inherit; background: rgba(36, 60, 88, 0.62); border: 1px solid var(--edge); padding: 3px 9px; }
      button:hover { border-color: var(--ice); }
      .page { max-width: 1680px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
      header { grid-column: 1 / -1; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
      header nav { margin-left: auto; display: flex; gap: 16px; font-size: 14px; }
      .glass { background: rgba(20, 36, 56, 0.78); border: 1px solid var(--edge); padding: 12px 14px; }
      .wide { grid-column: 1 / -1; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
      .tile b { display: block; font-size: 22px; font-weight: 500; } .tile span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
      .knobs { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 12px; align-items: center; }
      .knobs input[type=range] { width: 100%; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; } td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid rgba(168, 204, 234, 0.08); vertical-align: top; }
      th { color: var(--dim); font-weight: 400; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
      .dim { color: var(--dim); } .warn { color: var(--warn); } .bad { color: var(--bad); } .well { color: var(--well); }
      .scroll { max-height: 460px; overflow: auto; }
      canvas { width: 100%; aspect-ratio: 1; display: block; background: #0b1826; }
      .person { border-bottom: 1px solid rgba(168, 204, 234, 0.1); padding: 6px 0; }
      #msg { min-height: 1.3em; }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Cast</h1><span class="dim">the city's background people</span><span id="state"></span>
        <nav><a href="./">Admin</a><a href="../">Play</a></nav>
      </header>
      <section class="glass wide"><div class="tiles" id="tiles"></div></section>
      <section class="glass">
        <h2>Knobs</h2>
        <div class="knobs" id="knobs"></div>
        <p><button id="toggle"></button> <select id="scene"></select> <button id="spawn">Play it now</button></p>
        <p id="msg" class="dim"></p>
      </section>
      <section class="glass"><h2>Map: heat, stories, survivors</h2><canvas id="map" width="720" height="720"></canvas></section>
      <section class="glass"><h2>Stories</h2><div class="scroll"><table><thead><tr><th>Story</th><th>Phase</th><th>People</th><th>Choices and lines</th><th></th></tr></thead><tbody id="stories"></tbody></table></div></section>
      <section class="glass"><h2>Featured people</h2><div class="scroll" id="people"></div></section>
      <section class="glass wide"><h2>Planner's decisions</h2><div class="scroll"><table><thead><tr><th>Tick</th><th>Point</th><th>By</th><th>What</th><th>Why</th></tr></thead><tbody id="decisions"></tbody></table></div></section>
    </div>
    <script type="module" src="cast.js"></script>
  </body>
</html>
