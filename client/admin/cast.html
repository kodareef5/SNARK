<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cast · SNARK Admin</title>
    <link rel="stylesheet" href="/admin/ui/admin.css">
  </head>
  <body>
    <main class="tool-page cast-page">
      <header class="tool-intro"><h1>Cast</h1><p>Manage background characters, follow their stories and inspect the decisions behind them.</p></header>
      <span id="state" class="dim"></span>
      <section class="glass wide"><div class="tiles" id="tiles"></div></section>
      <section class="glass">
        <h2>Population &amp; pacing</h2>
        <div class="knobs" id="knobs"></div>
        <p><button id="toggle"></button> <select id="scene" aria-label="Scene to play"></select> <button id="spawn">Play it now</button></p>
        <p id="msg" class="dim"></p>
      </section>
      <section class="glass"><h2>Cast activity map</h2><canvas id="map" width="720" height="720"></canvas></section>
      <section class="glass"><h2>Stories</h2><div class="scroll"><table><thead><tr><th>Story</th><th>Phase</th><th>People</th><th>Choices and lines</th><th></th></tr></thead><tbody id="stories"></tbody></table></div></section>
      <section class="glass"><h2>Featured people</h2><div class="scroll" id="people"></div></section>
      <section class="glass wide"><h2>Planner decisions</h2><div class="scroll"><table><thead><tr><th>Tick</th><th>Point</th><th>By</th><th>What</th><th>Why</th></tr></thead><tbody id="decisions"></tbody></table></div></section>
    </main>
    <script type="module" src="/admin/ui/cast.js"></script>
  </body>
</html>
