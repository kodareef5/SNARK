<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cluster overview · SNARK</title>
    <link rel="stylesheet" href="/admin/ui/admin.css" />
    <link rel="stylesheet" href="/admin/ui/overview.css" />
  </head>
  <body>
    <main class="cluster-main">
      <header class="cluster-header">
        <h1 id="cluster-title">Cluster overview</h1>
        <time id="updated" class="cluster-updated" hidden></time>
      </header>
      <section id="access" class="cluster-access" aria-labelledby="access-title" hidden>
        <div>
          <h2 id="access-title">Admin access</h2>
          <p id="access-note" role="status"></p>
          <p id="signed-in-as" hidden></p>
        </div>
        <form id="sign-in">
          <div class="cluster-field" id="sign-in-world-field" hidden>
            <label for="sign-in-world">World</label>
            <select id="sign-in-world"></select>
          </div>
          <div class="cluster-field" id="name-field">
            <label for="sign-in-name">Name</label>
            <input id="sign-in-name" type="text" autocomplete="username" spellcheck="false" placeholder="Optional"
              title="With a shared password, any name: the admin log shows it. With your own password, your survivor's name or 17-digit ID." />
          </div>
          <div class="cluster-field" id="password-field">
            <label id="password-label" for="password">Password</label>
            <input id="password" type="password" required autocomplete="current-password" />
          </div>
          <button class="cluster-primary" id="submit-password" type="submit">Sign in</button>
          <button id="sign-out" type="button" hidden>Clear sign-in</button>
        </form>
      </section>
      <section id="cluster-overview" aria-label="World maps" hidden>
        <dl class="cluster-summary">
          <div><dt>Worlds</dt><dd id="world-count">—</dd></div>
          <div><dt>Survivors online</dt><dd id="player-count">—</dd></div>
          <div><dt>Player capacity</dt><dd id="capacity-count">—</dd></div>
        </dl>
        <p id="world-state" class="cluster-empty" role="status">Discovering worlds…</p>
        <div id="worlds" class="cluster-worlds"></div>
      </section>
      <section id="cluster-chat" class="cluster-chat" aria-label="Recent chat" hidden>
        <div class="cluster-chat-filters">
          <div class="cluster-field">
            <label for="chat-world">World</label>
            <select id="chat-world"><option value="">All worlds</option></select>
          </div>
          <div class="cluster-field">
            <label for="chat-channel">Channel</label>
            <select id="chat-channel"><option value="">All channels</option></select>
          </div>
        </div>
        <p class="cluster-chat-state" id="chat-state" role="status">Waiting for world chat…</p>
        <ol id="chat-lines" class="cluster-chat-lines" aria-label="Messages, newest first"></ol>
      </section>
    </main>
    <template id="world-card">
      <article class="cluster-world-card">
        <div class="cluster-preview">
          <canvas width="192" height="192" role="img" hidden></canvas>
          <p class="cluster-map-empty" hidden></p>
          <span class="cluster-map-north" title="North" aria-hidden="true" hidden>↑ N</span>
          <span class="cluster-map-key" aria-hidden="true" hidden><i></i> Online survivor</span>
        </div>
        <div class="cluster-world-body">
          <div class="cluster-world-heading">
            <div><h2><a></a></h2><p class="cluster-map-name"></p></div>
            <span class="cluster-health"></span>
          </div>
          <div class="cluster-world-population">
            <span class="cluster-count"></span><progress max="1" value="0" aria-label="Player capacity"></progress>
          </div>
          <p class="cluster-world-note" hidden></p>
          <div class="cluster-world-open" aria-hidden="true"><span></span><span>→</span></div>
        </div>
      </article>
    </template>
    <script type="module" src="/admin/ui/cluster.js"></script>
  </body>
</html>
