<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screens · SNARK Admin</title>
    <link rel="stylesheet" href="/admin/ui/admin.css" />
  </head>
  <body>
    <main class="tool-page screens-page">
      <header class="tool-intro"><h1>Screens</h1><p>Clips the cluster's screens may play, the channels that order them, and what the Vegas ball shows. Every world of the cluster shares them.</p></header>
      <section class="glass">
        <p id="msg" class="dim" aria-live="polite">Loading…</p>
        <button id="reload" hidden>Reload</button>
      </section>
      <section class="glass">
        <h2>Screens</h2>
        <div class="screen-grid">
          <div id="screens"></div>
          <div id="preview"><canvas width="160" height="160"></canvas><p class="faint">Preview of the ball</p></div>
        </div>
      </section>
      <section class="glass">
        <h2>Add a clip</h2>
        <label class="drop" id="drop">
          <span>Drop an .mp4 here, or click to pick one. The longer side up to <b id="cap-wide">854</b> px, the shorter up to <b id="cap-high">480</b> px, H.264 with AAC sound or none.</span>
          <input id="file" type="file" accept="video/mp4,.mp4" hidden />
        </label>
        <div id="picked" hidden>
          <div class="facts" id="facts"></div>
          <div id="over"></div>
          <div class="fields">
            <label>Title <input id="title" maxlength="80" autocomplete="off" /></label>
            <label>Who made it and why we may show it <input id="rights" maxlength="240" autocomplete="off" placeholder="e.g. Filmed by me for this server; or Public domain, Library of Congress" /></label>
          </div>
          <div class="bar send"><button id="send" class="primary">Upload and publish</button><button id="forget">Choose another</button></div>
          <div id="work" hidden>
            <p class="dim" id="work-say"></p>
            <label class="dim">Upload <progress id="up" max="1" value="0"></progress></label>
            <label class="dim">Reading the colours <progress id="read" max="1" value="0"></progress></label>
          </div>
        </div>
        <div id="waiting"></div>
      </section>
      <section class="glass">
        <h2>Library</h2>
        <div class="clips" id="clips"></div>
      </section>
      <section class="glass">
        <div class="bar"><h2 class="grow">Channels</h2><button id="add-channel">New channel</button><button id="save-channels" class="primary" disabled>Save channels</button><button id="undo-channels" disabled>Undo changes</button></div>
        <p id="channels-say" class="dim"></p>
        <div id="channels"></div>
      </section>
    </main>
    <script type="module" src="/admin/ui/screens.js"></script>
  </body>
</html>
