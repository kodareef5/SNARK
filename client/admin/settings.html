<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings · SNARK Admin</title>
    <link rel="stylesheet" href="/admin/ui/admin.css">
  </head>
  <body>
    <main class="tool-page settings-page">
      <header class="tool-intro"><h1>Settings</h1><p>Changes take effect when you leave a field.</p></header>
      <section class="tool-panel bar" aria-label="Filter settings">
        <input id="search" type="search" placeholder="Find a setting" aria-label="Find a setting">
        <select id="show" aria-label="Setting type"></select>
        <span id="count"></span><span id="msg" role="status"></span>
      </section>
      <div id="groups"></div>
    </main>
    <script type="module" src="/admin/ui/settings.js"></script>
  </body>
</html>
