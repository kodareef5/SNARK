<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Scene studio · SNARK</title>
    <link rel="stylesheet" href="/admin/ui/admin.css" />
    <link rel="stylesheet" href="/admin/ui/scene-studio.css" />
  </head>
  <body>
    <main class="tool-page scene-page">
      <header class="tool-intro"><h1>Scene studio</h1></header>
      <nav class="scene-categories" aria-label="Scene category">
        <button type="button" data-category="title" aria-pressed="true">Title</button>
        <button type="button" data-category="loaders" aria-pressed="false">Loaders</button>
        <button type="button" data-category="wiki" aria-pressed="false">Wiki</button>
      </nav>
      <div id="studio-status"><p id="notice" role="status"></p><button id="reload" hidden>Reload library</button></div>
      <div class="studio-grid">
        <section class="monitor" id="live-monitor" aria-label="Scene preview">
          <div
            id="view"
            tabindex="0"
            aria-label="Camera preview. Drag to aim, shift-drag to truck and lift, or scroll to dolly. Arrow keys aim the camera."
          >
            <iframe title="Live Miami set" tabindex="-1"></iframe>
            <div id="guide" hidden aria-hidden="true"></div>
          </div>
          <div class="tools">
            <span id="playback" role="status">Loading set…</span>
            <button id="pause">Pause motion</button>
            <label><input id="guides" type="checkbox" /> Thirds</label>
            <label>Frame <select id="aspect"><option value="wide">Landscape</option><option value="tall">Portrait</option></select></label>
          </div>
          <p class="help">Drag to aim · Shift-drag to truck and lift · Scroll to dolly</p>
        </section>
        <aside class="tool-panel" id="editor-panel">
          <div class="section">
            <label for="shots">Saved shot</label><select id="shots"></select>
            <label for="name">Shot name</label><input id="name" maxlength="80" autocomplete="off" />
            <p id="published"></p>
          </div>
          <div class="section">
            <h2>Camera &amp; light</h2>
            <div id="controls"></div>
            <button id="reset">Reset framing</button>
          </div>
          <div class="actions">
            <button id="copy">Duplicate shot</button><button id="save">Save draft</button>
            <button class="primary" id="publish" disabled>Publish title</button>
          </div>
        </aside>
        <section class="monitor" id="wiki-monitor" aria-label="Wiki photo preview" hidden>
          <div class="wiki-preview"><img id="wiki-picture" alt="" hidden /><p id="wiki-preview-note" role="status"></p></div>
        </section>
        <aside class="tool-panel" id="wiki-panel" hidden>
          <div class="section">
            <label for="recipes">Recipe</label><select id="recipes"></select>
            <p id="recipe-description"></p>
          </div>
          <dl id="recipe-detail"></dl>
          <details id="recipe-declaration" hidden><summary>Camera declaration</summary><pre id="recipe-source"></pre></details>
          <a id="recipe-page" hidden>Open wiki page ↗</a>
        </aside>
      </div>
    </main>
    <script type="module" src="/admin/ui/shell.js"></script>
    <script type="module" src="/admin/ui/scene-studio.js"></script>
  </body>
</html>
