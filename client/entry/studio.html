<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNARK · Studio</title>
<style>
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; color-scheme: dark }
body { display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #0f1a31; color: #f4f1e8; font: 14px/1.4 system-ui, sans-serif }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab }
canvas:active { cursor: grabbing }
.bar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 8px; border-top: 1px solid #3b527a }
[hidden] { display: none !important }
#moves { display: contents }
select, button { font: inherit; color: inherit; background: #1e3153; border: 1px solid #778fb8; border-radius: 4px; padding: 3px 8px }
button { cursor: pointer }
button:hover, select:hover { border-color: #f4f1e8 }
:focus-visible { outline: 2px solid #a4caff; outline-offset: -2px }
#move { max-width: min(16rem, 45vw) }
#time { flex: 1 1 5rem; min-width: 4rem; accent-color: #a4caff }
output { min-width: 5rem; font-variant-numeric: tabular-nums }
label { display: inline-flex; gap: 4px; align-items: center }
#note { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 2rem; background: #0f1a31; text-align: center }
@media (pointer: coarse) {
  button, select, label { min-height: 38px }
}
</style>
</head>
<body>
<canvas tabindex="0" aria-label="3D model"></canvas>
<div class="bar" role="group" aria-label="Model controls">
  <span id="moves" hidden>
    <select id="move" aria-label="Move"></select>
    <button id="play" type="button" aria-pressed="false">Play</button>
    <input id="time" type="range" min="0" max="1" step="0.001" value="0" aria-label="Animation position">
    <output id="told" aria-live="off"></output>
    <select id="speed" aria-label="Playback speed"></select>
    <label><input id="loop" type="checkbox" checked>Loop</label>
  </span>
  <span id="spin" hidden><label><input id="spinning" type="checkbox"><span id="spinlabel">Turn wheels</span></label></span>
  <label><input id="turn" type="checkbox">Auto rotate</label>
  <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
  <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
  <button id="reset" type="button">Reset view</button>
</div>
<p id="note" hidden role="alert"></p>
<script type="module" src="studio.js"></script>
</body>
</html>
