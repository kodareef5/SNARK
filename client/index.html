<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNARK proving ground</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #readout { position: absolute; left: 12px; top: 10px; white-space: pre; text-shadow: 0 1px 2px #000; }
  #minimap { position: absolute; right: 12px; top: 12px; width: 160px; height: 160px; border: 1px solid #0008; image-rendering: pixelated; }
  #vitals { position: absolute; right: 12px; bottom: 12px; width: 160px; }
  .vital { display: flex; align-items: center; gap: 6px; margin-top: 4px; text-shadow: 0 1px 2px #000; }
  .vital span { width: 56px; }
  .vital i { flex: 1; height: 8px; background: #0006; }
  .vital b { display: block; height: 100%; background: #e8e8e0; }
  #cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: #fffc; }
  #status { position: absolute; left: 12px; bottom: 12px; white-space: pre; max-width: 70%; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="readout"></div>
  <canvas id="minimap"></canvas>
  <div id="vitals"></div>
  <div id="cross"></div>
  <div id="status">loading</div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
