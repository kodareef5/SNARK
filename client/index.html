<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNARK proving ground</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* Every child is one interface node; client/shell/ui.ts sets where it goes and how it looks. */
  #ui { position: fixed; inset: 0; overflow: hidden; pointer-events: none; color: #eee; font: 13px ui-monospace, Menlo, Consolas, monospace; user-select: none; }
  #ui > * { position: absolute; left: 0; top: 0; box-sizing: border-box; white-space: pre; overflow: hidden; }
  #ui > input { border: 0; outline: 0; padding: 0 6px; font-family: inherit; user-select: text; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">loading</div>
<script type="module" src="main.js"></script>
</body>
</html>
