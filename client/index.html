<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNARK: Miami Devolved</title>
<!-- MODULES -->
<script>
  const probeParams = new URLSearchParams(location.search);
  if (["device","bench","selfcheck","look","trip"].some(key => probeParams.has(key))) document.documentElement.classList.add("probe");
  document.addEventListener("error", event => {
    if (!(event.target instanceof HTMLScriptElement) || event.target.type !== "module") return;
    document.getElementById("boot-heading").textContent = "Couldn’t enter world";
    document.getElementById("boot-line").textContent = "The game files couldn’t load. Return to survivors to try again.";
    document.getElementById("boot-progress").hidden = true;
    document.getElementById("entry-back").hidden = false;
  }, true);
  // What the first frame needs is asked for as the page is read. A device probe measures the link quiet first (client/core/device.ts).
  if (!new URLSearchParams(location.search).has("device")) for (const href of FETCHED) document.head.append(Object.assign(document.createElement("link"), { rel: "preload", as: "fetch", crossOrigin: "anonymous", href }));
</script>
<!-- HUD_FONT_PRELOAD -->
<link rel="preload" href="HUD_ATLAS_URL" as="image">
<style>
  @font-face { font-family: Hud; src: HUD_FONT_SOURCE; font-style: normal; font-weight: 500; font-display: swap; }
  /* The page is the game: a drag, a pinch or a long press does nothing to it. The body's padding is the screen's own edges, which the shell reads. */
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #boot-splash {
    position: fixed; inset: 0; z-index: 2; display: grid; align-content: end;
    padding: clamp(24px,6vw,96px); padding-bottom: max(7svh,env(safe-area-inset-bottom),24px);
    background: linear-gradient(0deg,#061322 0%,#07192bd9 14%,transparent 69%),url("/cluster/loader-poster.webp") center/cover,#102337;
    color: #f1f6ff; font-family: Hud,system-ui,sans-serif;
  }
  @media (orientation: portrait) {
    #boot-splash { background-image: linear-gradient(0deg,#061322 1%,#07192be8 20%,transparent 76%),url("/cluster/loader-poster.webp?portrait"); }
  }
  .probe #boot-splash, #boot-splash[hidden], #boot-splash [hidden] { display: none; }
  #boot-splash img { width: clamp(130px,min(35vw,29vh),260px); height: auto; }
  #boot-splash h1 { margin: clamp(12px,3vh,32px) 0 .25em; font: 600 clamp(2rem,5vw,4rem)/1 system-ui,sans-serif; letter-spacing: -.055em; }
  #boot-splash progress { display: block; appearance: none; border: 0; border-radius: 0; margin: 16px 0 10px; width: min(100%,26rem); height: 3px; background: #7693a85c; color: #80caff; }
  #boot-splash progress::-webkit-progress-bar { background: #7693a85c; }
  #boot-splash progress::-webkit-progress-value { background: #80caff; }
  #boot-splash progress::-moz-progress-bar { background: #80caff; }
  #boot-line { max-width: 40rem; color: #d6e8f5; overflow-wrap: anywhere; }
  #entry-back { width: fit-content; margin-top: 1rem; padding: .75rem 1rem; border: 1px solid #93b6d2; color: white; text-decoration: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Every child is one interface node; client/shell/ui.ts sets where it goes and how it looks. */
  #ui { position: fixed; inset: 0; overflow: hidden; pointer-events: none; color: #e3f4fc; font: 500 13px Hud, Arial, sans-serif; font-kerning: none; user-select: none; }
  #ui > * { position: absolute; left: 0; top: 0; box-sizing: border-box; white-space: pre; overflow: hidden; touch-action: none; }
  #ui > input { border: 0; outline: 0; padding: 0 6px; font-family: inherit; user-select: text; }
  #ui > input[type=range] { appearance: none; margin: 0; padding: 0; background: none; touch-action: none; cursor: ew-resize; }
  #ui > input[type=range]::-webkit-slider-runnable-track { height: 2px; background: transparent; }
  #ui > input[type=range]::-webkit-slider-thumb { appearance: none; width: 16px; height: 28px; margin-top: -13px; background: transparent; border: 0; }
  #ui > input[type=range]::-moz-range-track { height: 2px; background: transparent; }
  #ui > input[type=range]::-moz-range-thumb { width: 16px; height: 28px; background: transparent; border: 0; }
  #ui > input[type=range]:focus-visible { outline: 1px solid #a6e3f4; outline-offset: -2px; }
  #ui > button { border: 0; padding: 0; font: inherit; border-radius: 0; cursor: pointer; }
  #ui > button:focus-visible { outline: 1px solid #a6e3f4; outline-offset: -2px; }
  /* These four actions already have core's selected wash and vertical focus stroke. */
  #ui > button:is([data-k="5401"], [data-k="5402"], [data-k="5403"], [data-k="5405"], [data-k="5406"]):focus-visible { outline: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<section id="boot-splash" aria-labelledby="boot-heading">
  <img src="title/snark-emblem.webp" loading="lazy" width="480" height="480" alt="SNARK · Miami Devolved">
  <h1 id="boot-heading">Entering world</h1>
  <progress id="boot-progress" max="4" value="0" aria-label="World loading"></progress>
  <span id="boot-line" role="status">Loading world data…</span>
  <a id="entry-back" href="./?screen=roster" hidden>Return to survivors</a>
</section>
<div id="ui"></div>
<script type="module" src="main.js"></script>
</body>
</html>
