<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sound board · SNARK Admin</title>
    <link rel="stylesheet" href="/admin/ui/admin.css">
  </head>
  <body>
    <main class="tool-page board-page">
      <header class="tool-intro"><h1>Sound board</h1><p>Select a cue or a numbered take to hear it at the chosen distance and direction.</p></header>
      <p id="note"></p>
    <div class="tool-panel controls bar">
      <label>Distance <input id="far" type="range" min="0" max="60" step="1" value="3" oninput="farOut.textContent = this.value + ' m'" /><output id="farOut">3 m</output></label>
      <label>From <select id="way"><option>ahead</option><option>right</option><option>behind</option><option>left</option></select></label>
      <label><input id="vary" type="checkbox" checked /> Vary pitch</label>
      <label>Find <input id="find" type="search" placeholder="dodo, step, alarm, waits:" /></label>
      <label><input id="missing" type="checkbox" /> Show missing or shared takes</label>
      <label><input id="later" type="checkbox" /> Include planned cues</label>
    </div>
    <p id="empty-sounds" role="status" hidden>No cues match these filters.</p>
      <div id="list">Loading sounds…</div>
    </main>
    <script type="module" src="/admin/ui/board.js"></script>
  </body>
</html>
