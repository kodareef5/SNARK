; A boosted server: experience, taming, harvesting, hatching and growing up
; 10 times as fast as ARK's own.
;
;   bun server/main.ts --config config/boosted-10x
;
; Everything not written here is ARK's default. See
; planning/reference/settings.md for every setting and what it does, and
; planning/reference/operators.md for how these files are read.

[ServerSettings]
; Experience 10 times as fast, however it is earned.
XPMultiplier=10
; Taming 10 times as fast: each thing a creature eats counts for 10.
TamingSpeedMultiplier=10
; Each blow at a tree, a rock or a bush gives 10 times as much.
HarvestAmountMultiplier=10
; Stacks 5 times the size, to hold it. What is one to a slot (a tool, a weapon) stays so.
ItemStackSizeMultiplier=5
; A node that was used up grows back in this share of its time: lower is sooner.
ResourcesRespawnPeriodMultiplier=0.5
; Wild creatures are found at levels 5 to 150, as on ARK's official servers.
OverrideOfficialDifficulty=5.0
; The damage of a hit is shown where it landed.
ShowFloatingDamageText=True

[SessionSettings]
SessionName=A 10x server

[MessageOfTheDay]
Message=Welcome.\nEverything here is 10 times as fast.
Duration=20
