; A boosted server: experience, taming, harvesting, hatching and growing up
; 50 times as fast as ARK's own.
;
;   bun server/main.ts --config config/boosted-50x
;
; Everything not written here is ARK's default. See
; planning/reference/settings.md for every setting and what it does, and
; planning/reference/operators.md for how these files are read.

[ServerSettings]
; Experience 50 times as fast, however it is earned.
XPMultiplier=50
; Taming 50 times as fast: each thing a creature eats counts for 50.
TamingSpeedMultiplier=50
; Each blow at a tree, a rock or a bush gives 50 times as much.
HarvestAmountMultiplier=50
; Stacks 10 times the size, to hold it. What is one to a slot (a tool, a weapon) stays so.
ItemStackSizeMultiplier=10
; A node that was used up grows back in this share of its time: lower is sooner.
ResourcesRespawnPeriodMultiplier=0.2
; Wild creatures are found at levels 5 to 150, as on ARK's official servers.
OverrideOfficialDifficulty=5.0
; The damage of a hit is shown where it landed.
ShowFloatingDamageText=True

[SessionSettings]
SessionName=A 50x server

[MessageOfTheDay]
Message=Welcome.\nEverything here is 50 times as fast.
Duration=20
