; A development server. Read by `bun run dev`, and by `bun server/main.ts --dev`
; when no other folder is named with --config.
;
; Everything not set here is ARK's default. See planning/reference/settings.md
; for every setting and what it does.

[ServerSettings]
; Taming ten times as fast: a raptor of level 30 in a minute and a half.
TamingSpeedMultiplier=10
; The damage of a hit is shown where it landed, to see what a head and a leg are worth.
ShowFloatingDamageText=True
; A piece may be taken back at any time, not only in the half minute after it is set down.
AlwaysAllowStructurePickup=True
