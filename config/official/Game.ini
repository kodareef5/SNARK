; A server set as ARK's official ones are: see GameUserSettings.ini beside this file.
; Every multiplier here is ARK's own, written at 1.0 to show where it goes.

[/script/shootergame.shootergamemode]
; Experience by how it was earned, on top of XPMultiplier.
KillXPMultiplier=1.0
HarvestXPMultiplier=1.0
CraftXPMultiplier=1.0

; Breeding: how fast an egg hatches and the young grow up, how long a female waits, how fast a pair's mating goes.
EggHatchSpeedMultiplier=1.0
BabyMatureSpeedMultiplier=1.0
MatingIntervalMultiplier=1.0
MatingSpeedMultiplier=1.0
BabyFoodConsumptionSpeedMultiplier=1.0

; How long things keep, how long a dropped bag and what the dead leave lie, how long fuel burns.
GlobalSpoilingTimeMultiplier=1.0
GlobalItemDecompositionTimeMultiplier=1.0
GlobalCorpseDecompositionTimeMultiplier=1.0
FuelConsumptionIntervalMultiplier=1.0

; What an owner's level is worth to a tame: ARK's own 0.2 for health (index 0) and 0.17 for melee (index 8).
PerLevelStatsMultiplier_DinoTamed[0]=0.2
PerLevelStatsMultiplier_DinoTamed[8]=0.17

; Three minutes after something built is harmed before it may be mended.
StructureDamageRepairCooldown=180

; No cheats for whoever joins, as on ARK's official servers: no Creative entry in the menu, and the admin role only by
; enablecheats with the admin password. Unless set, every survivor has cheats from the start.
bShowCreativeMode=False
