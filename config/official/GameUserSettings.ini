; A server set as ARK's official ones are, as far as its reference says.
;
;   bun server/main.ts --config config/official
;
; Rates are ARK's own. The ones an operator most often changes are written
; here at 1.0, to show where they go; everything not written is ARK's default.
; See planning/reference/settings.md for every setting and what it does, and
; planning/reference/operators.md for how these files are read.

[ServerSettings]
; Wild creatures are found at levels 5 to 150. ARK's official servers set this outright.
OverrideOfficialDifficulty=5.0
; Survivors, their tames and what they build can be harmed by other tribes. True makes a PvE server.
serverPVE=False

; Experience, taming and harvesting, each at ARK's own rate.
XPMultiplier=1.0
TamingSpeedMultiplier=1.0
HarvestAmountMultiplier=1.0
; Stacks as content has them; nodes grow back in their own time.
ItemStackSizeMultiplier=1.0
ResourcesRespawnPeriodMultiplier=1.0

; A day of 50.4 minutes, day and night at the same pace.
DayCycleSpeedScale=1.0
DayTimeSpeedScale=1.0
NightTimeSpeedScale=1.0

; A tribe may hold 300 tamed creatures (ARK's official PvP servers; its PvE ones allow 500), and the server 5000 in all.
MaxPersonalTamedDinos=300
MaxTamedDinos=5000

; What a client shows: no damage numbers; the view from behind, a crosshair, and where the reader is on the map.
ShowFloatingDamageText=False
AllowThirdPersonPlayer=True
ServerCrosshair=True
ShowMapPlayerLocation=True

; A piece may be taken back for half a minute after it is set down.
StructurePickupTimeAfterPlacement=30
AlwaysAllowStructurePickup=False

; Whoever does nothing for an hour is put off, if the server was started with -EnableIdlePlayerKick.
KickIdlePlayersPeriod=3600
; How often the live file (DynamicConfig.ini, with -UseDynamicConfig) is read again, in minutes.
AutoSavePeriodMinutes=15

[SessionSettings]
SessionName=An official-style server

[/Script/Engine.GameSession]
MaxPlayers=70

[MessageOfTheDay]
Message=Welcome.
Duration=20
