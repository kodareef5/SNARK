<!doctype html>
<html><head><meta charset="utf-8"><title>DDoS-Brella</title>
<link rel="stylesheet" href="ads.css">
<script type="application/json" id="ad">{ "name": "ddos-brella", "title": "DDoS-Brella: when the packets start pouring", "type": "billboard", "kind": "image" }</script>
<style>
  .ad { background: var(--deep); }
  .rain { left: 0; top: 0; width: 560px; height: 420px; }
  .head { left: 582px; top: 24px; font-size: 54px; color: var(--mint); }
  .logo { left: 570px; top: 88px; font-size: 140px; color: var(--mustard); line-height: 1.05; --stroke: 9px; --stroke-colour: var(--ink); }
  .tag { left: 586px; top: 260px; font-size: 38px; color: var(--cream); }
  .fine { left: 588px; top: 360px; font-size: 20px; color: var(--mint); }
</style></head>
<body>
<div class="ad" data-w="1280" data-h="420">
  <svg class="abs rain" viewBox="0 0 560 420" id="rain">
    <path d="M70 190 Q280 0 490 190 Q455 168 420 190 Q385 168 350 190 Q315 168 280 190 Q245 168 210 190 Q175 168 140 190 Q105 168 70 190 Z" fill="#e0482e" stroke="#2b211d" stroke-width="6" stroke-linejoin="round"/>
    <path d="M280 52 Q240 120 210 190 M280 52 Q320 120 350 190 M280 52 V190" stroke="#2b211d" stroke-width="4" fill="none"/>
    <path d="M280 190 L300 262 q5 20 -14 24" stroke="#2b211d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <use href="#man" x="222" y="200" width="110" height="210" style="color: #f4e9cc"/>
  </svg>
  <div class="abs cond head misreg" style="--shadow: var(--ink)">When the packets pour&hellip;</div>
  <div class="abs script logo outline">DDoS-Brella</div>
  <div class="abs tag slab">Keeps you dry up to 10 gigabits!</div>
  <div class="abs fine small">Lightning not covered. Neither is the server.</div>
</div>
<script>
  // Packets fall where the umbrella is not, in a fixed scatter.
  const svg = document.getElementById("rain");
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 320; i++) {
    const x = 8 + rnd() * 510, y = rnd() * 420;
    if (x > 50 && x < 510 && y > 120) continue;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x.toFixed(0));
    t.setAttribute("y", y.toFixed(0));
    t.setAttribute("font-family", "AdMono");
    t.setAttribute("font-weight", "700");
    t.setAttribute("font-size", (12 + rnd() * 10).toFixed(0));
    t.setAttribute("fill", rnd() < 0.5 ? "#9fd2c4" : "#eab13a");
    t.textContent = rnd() < 0.5 ? "01" : "10";
    svg.insertBefore(t, svg.firstChild);
  }
</script>
<script src="ads.js"></script>
</body></html>
