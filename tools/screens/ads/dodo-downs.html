<!doctype html>
<html><head><meta charset="utf-8"><title>Dodo Downs</title>
<link rel="stylesheet" href="ads.css">
<script type="application/json" id="ad">{ "name": "dodo-downs", "title": "Dodo Downs: live dodo racing by the big ball", "type": "billboard", "kind": "image" }</script>
<style>
  .ad { background: var(--navy); }
  .ball { left: 1010px; top: 12px; width: 250px; height: 250px; }
  .head { left: 40px; top: 22px; font-size: 44px; color: var(--mustard); letter-spacing: 0.06em; }
  .logo { left: 30px; top: 64px; font-size: 158px; color: var(--pink); line-height: 1.05; --stroke: 7px; --stroke-colour: var(--white); text-shadow: 0 0 18px var(--tomato), 0 0 4px var(--tomato); }
  .tag { left: 44px; top: 248px; font-size: 34px; color: var(--cream); }
  .fine { left: 46px; top: 380px; font-size: 19px; color: var(--mint); }
  .track { left: 0; top: 300px; width: 1280px; height: 120px; }
  .bird { position: absolute; }
</style></head>
<body>
<div class="ad" data-w="1280" data-h="420">
  <svg class="abs ball" viewBox="0 0 280 280">
    <defs><clipPath id="sphere"><circle cx="140" cy="140" r="130"/></clipPath>
      <radialGradient id="glow" cx="0.38" cy="0.34" r="0.7"><stop offset="0" stop-color="#eab13a"/><stop offset="0.6" stop-color="#e0482e"/><stop offset="1" stop-color="#a8301f"/></radialGradient>
      <pattern id="pucks" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3.6" fill="#fbf6e8" opacity="0.55"/></pattern></defs>
    <circle cx="140" cy="140" r="130" fill="url(#glow)"/>
    <rect width="280" height="280" fill="url(#pucks)" clip-path="url(#sphere)"/>
    <g clip-path="url(#sphere)" fill="none" stroke="#2b211d" stroke-width="3" opacity="0.5">
      <ellipse cx="140" cy="140" rx="130" ry="40"/><ellipse cx="140" cy="140" rx="60" ry="130"/><ellipse cx="140" cy="140" rx="110" ry="130"/></g>
    <text x="140" y="150" text-anchor="middle" font-family="AdScript" font-size="54" fill="#fbf6e8" stroke="#fbf6e8" stroke-width="1.5">Bet!</text>
  </svg>
  <div class="abs cond head">Las Vegas · nightly by the big ball</div>
  <div class="abs script logo outline">Dodo Downs</div>
  <div class="abs tag slab">Live dodo racing! Post time 7:30.</div>
  <svg class="abs track" viewBox="0 0 1280 120">
    <rect y="40" width="1280" height="80" fill="#a8301f"/>
    <path d="M0 40 H1280" stroke="#fbf6e8" stroke-width="6"/>
    <g fill="#fbf6e8"><rect x="0" y="22" width="1280" height="5"/><rect x="40" y="22" width="6" height="22"/><rect x="200" y="22" width="6" height="22"/><rect x="360" y="22" width="6" height="22"/><rect x="520" y="22" width="6" height="22"/><rect x="680" y="22" width="6" height="22"/><rect x="840" y="22" width="6" height="22"/><rect x="1000" y="22" width="6" height="22"/><rect x="1160" y="22" width="6" height="22"/></g>
  </svg>
  <div class="dino bird" data-src="art/dodo-run-03.png" data-inks="ink navy mint cream white" data-dot-size="4" style="left:650px;top:216px;width:150px;height:150px"></div>
  <div class="dino bird" data-src="art/dodo-run-08.png" data-inks="ink brick mustard cream white" data-dot-size="4" style="left:780px;top:226px;width:140px;height:140px"></div>
  <div class="dino bird" data-src="art/dodo-run-05.png" data-inks="ink deep teal mint white" data-dot-size="4" style="left:900px;top:206px;width:160px;height:160px"></div>
  <div class="abs fine small" style="color: var(--cream)">No dodo has ever finished a race. Bet accordingly.</div>
</div>
<script src="ads.js"></script>
</body></html>
