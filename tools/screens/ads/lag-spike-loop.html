<!doctype html>
<html><head><meta charset="utf-8"><title>Lag spike loop</title>
<link rel="stylesheet" href="ads.css">
<script type="application/json" id="ad">{ "name": "lag-spike-loop", "title": "Lag-Away Tonic: a lag spike glitches the board", "type": "billboard", "kind": "clip", "seconds": 8, "poster": 5.5 }</script>
<style>
  .ad { background: var(--navy); }
  .scene { position: absolute; inset: 0; }
  .glitch { left: 0; width: 1280px; top: 60px; height: 220px; }
  .slice { position: absolute; left: 0; width: 1280px; overflow: hidden; }
  .slice div { position: absolute; left: 0; width: 1280px; text-align: center; font-size: 200px; line-height: 220px; }
  .meter { left: 720px; width: 520px; top: 300px; font-size: 52px; color: var(--mint); text-align: center; }
  .runner { top: 250px; width: 70px; height: 140px; color: var(--mustard); }
  .tonic { background: var(--cream); }
  .bottle { left: 70px; top: 30px; width: 140px; height: 360px; }
  .logo { left: 250px; top: 40px; font-size: 140px; color: var(--tomato); line-height: 1; --shadow: var(--navy); }
  .sub { left: 640px; top: 168px; font-size: 92px; color: var(--navy); }
  .tag { left: 262px; top: 296px; font-size: 40px; color: var(--navy); }
  .ping { left: 960px; top: 290px; font-size: 44px; color: var(--teal); }
  .wipe { left: 0; width: 1280px; height: 10px; background: var(--mint); }
</style></head>
<body>
<div class="ad" data-w="1280" data-h="420">
  <div class="scene" id="spike">
    <div class="abs glitch" id="glitch"></div>
    <div class="abs mono meter" id="meter"><b>PING 999 ms</b></div>
    <svg class="abs runner" id="runner" viewBox="0 0 100 200"><use href="#run"/></svg>
  </div>
  <div class="scene tonic" id="tonic">
    <svg class="rays" data-rays="30 140 420 mint cream" style="clip-path: polygon(0 0, 300px 0, 300px 100%, 0 100%)"></svg>
    <svg class="abs bottle offset" viewBox="0 0 150 350" style="--off: var(--navy)">
      <rect x="52" y="0" width="46" height="34" rx="5" fill="#2b211d"/>
      <path d="M56 34 h38 v40 q42 24 42 70 v186 q0 16 -16 16 h-90 q-16 0 -16 -16 v-186 q0 -46 42 -70 z" fill="#a8301f" stroke="#2b211d" stroke-width="6"/>
      <rect x="20" y="150" width="110" height="140" fill="#f4e9cc" stroke="#2b211d" stroke-width="5"/>
      <text x="75" y="178" text-anchor="middle" font-family="AdCentury" font-weight="700" font-size="11" fill="#213a5a">DR. PINGWELL'S</text>
      <text x="75" y="226" text-anchor="middle" font-family="AdScript" font-size="26" fill="#e0482e" stroke="#e0482e" stroke-width="1">Lag-Away</text>
      <text x="75" y="262" text-anchor="middle" font-family="AdNarrow" font-weight="700" font-size="12" fill="#213a5a">0 MS · 0 DESYNC</text>
    </svg>
    <div class="abs cent logo misreg">Lag-Away</div>
    <div class="abs script sub">Tonic</div>
    <div class="abs slab tag">Cures the spike in one gulp!</div>
    <div class="abs mono ping" id="ping"><b>PING 20 ms</b></div>
  </div>
  <div class="abs wipe" id="wipe"></div>
</div>
<script>
  const T = 8;
  const $ = (id) => document.getElementById(id);
  // The words in three inks, cut in eight slices that slide apart when it glitches.
  const SLICES = 8, inks = ["#e0482e", "#9fd2c4", "#f4e9cc"];
  const slices = [];
  for (let k = 0; k < SLICES; k++) {
    const s = document.createElement("div");
    s.className = "slice";
    s.style.top = `${(k * 220) / SLICES}px`;
    s.style.height = `${220 / SLICES + 1}px`;
    const layers = inks.map((c) => {
      const d = document.createElement("div");
      d.className = "cond";
      d.textContent = "LAG SPIKE";
      d.style.color = c;
      d.style.top = `${(-k * 220) / SLICES}px`;
      d.style.mixBlendMode = c === "#f4e9cc" ? "normal" : "screen";
      s.appendChild(d);
      return d;
    });
    slices.push({ s, layers });
    $("glitch").appendChild(s);
  }
  // A fixed noise for each tenth of a second, so a frame always draws the same.
  const noise = (n, k) => {
    let h = (n * 374761393 + k * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (((h ^ (h >>> 16)) >>> 0) % 10000) / 10000;
  };
  function frame(t) {
    t = Ad.wrap(t, T);
    const tick = Math.floor(t * 10);
    // It glitches hard in bursts and is nearly still between them.
    const hard = (t > 0.4 && t < 1.2) || (t > 2.0 && t < 2.6) || (t > 7.6);
    slices.forEach(({ layers }, k) => {
      const shove = hard ? (noise(tick, k) - 0.5) * 160 : (noise(tick, k) - 0.5) * 6;
      layers.forEach((d, j) => {
        const split = (j - 1) * (hard ? 14 : 4);
        d.style.transform = `translateX(${shove + split}px)`;
        d.style.opacity = j === 2 ? (hard ? 0.85 : 1) : 0.9;
      });
    });
    // The ping climbs, and the runner is pulled back each time he gets anywhere.
    const ms = Math.round(220 + 779 * (t < 6 ? Ad.ease(t, 0, 3) : 1 - Ad.ease(t, 7.7, 8)));
    $("meter").innerHTML = `<b>PING ${ms} ms</b>`;
    const lap = Ad.wrap(t, 1.2) / 1.2;
    $("runner").style.left = `${200 + lap * 260 - (lap > 0.8 ? (lap - 0.8) * 5 * 260 : 0) + Math.floor(t / 1.2) * 120}px`;
    $("runner").style.opacity = 1 - Ad.ease(t, 3.0, 3.4);
    // A scan line wipes to the tonic at 3.6 s and back to the spike at 7.5 s.
    const into = Ad.ease(t, 3.4, 3.8), out = Ad.ease(t, 7.4, 7.8);
    const cover = into * (1 - out);
    $("tonic").style.clipPath = `inset(0 0 ${(1 - cover) * 100}% 0)`;
    const edge = t < 5.6 ? into : 1 - out;
    $("wipe").style.top = `${edge * 420 - 5}px`;
    $("wipe").style.opacity = edge > 0 && edge < 1 ? 1 : 0;
    const ping = Math.round(999 - Ad.ease(t, 4.2, 5.6) * 979);
    $("ping").innerHTML = `<b>PING ${ping} ms</b>`;
  }
</script>
<script src="ads.js"></script>
</body></html>
