<!doctype html>
<html><head><meta charset="utf-8"><title>Server not responding</title>
<link rel="stylesheet" href="ads.css">
<script type="application/json" id="ad">{ "name": "not-responding", "title": "The server is not responding, and offers three buttons", "type": "laptop", "kind": "image" }</script>
<style>
  .ad {
    background-color: var(--teal);
    background-image: radial-gradient(circle, rgba(21, 90, 93, 0.9) 22%, transparent 26%);
    background-size: 6px 6px;
  }
  .menu { left: 0; top: 0; width: 1280px; height: 44px; background: var(--cream); border-bottom: 4px solid var(--ink); font-size: 24px; padding: 8px 22px; word-spacing: 26px; }
  .icon { width: 130px; text-align: center; font-size: 20px; color: var(--cream); }
  .icon svg { display: block; margin: 0 auto 6px; }
  .win { left: 250px; top: 170px; width: 800px; height: 470px; background: var(--cream); border: 5px solid var(--ink); box-shadow: 14px 14px 0 var(--ink); }
  .title { height: 46px; border-bottom: 5px solid var(--ink); background: repeating-linear-gradient(0deg, var(--ink) 0 3px, var(--cream) 3px 7px); display: flex; justify-content: center; align-items: center; }
  .title span { background: var(--cream); padding: 0 18px; font-size: 26px; }
  .body { position: absolute; left: 200px; top: 90px; right: 40px; font-size: 30px; line-height: 1.3; white-space: normal; color: var(--ink); }
  .body .big { font-size: 40px; margin-bottom: 16px; color: var(--brick); }
  .bird { left: 36px; top: 96px; width: 150px; height: 150px; }
  .btns { position: absolute; left: 40px; right: 40px; bottom: 34px; display: flex; justify-content: flex-end; gap: 22px; }
  .btn { border: 4px solid var(--ink); border-radius: 14px; padding: 8px 26px; font-size: 28px; background: var(--white); }
  .btn.def { outline: 5px solid var(--ink); outline-offset: 4px; background: var(--mustard); }
  .clock { right: 24px; top: 8px; font-size: 24px; }
</style></head>
<body>
<div class="ad" data-w="1280" data-h="800">
  <div class="abs menu geo"><b>SNARK</b> File Edit Tribe Wipe Help</div>
  <div class="abs clock mono">6:07 AM</div>
  <div class="abs icon geo" style="left: 1110px; top: 80px"><svg width="70" height="84" viewBox="0 0 70 84"><path d="M4 4 H50 L66 20 V80 H4 Z" fill="#fbf6e8" stroke="#2b211d" stroke-width="4"/><path d="M50 4 V20 H66" fill="none" stroke="#2b211d" stroke-width="4"/></svg>Base.sav</div>
  <div class="abs icon geo" style="left: 1110px; top: 230px"><svg width="76" height="70" viewBox="0 0 76 70"><path d="M2 12 H28 L34 20 H74 V68 H2 Z" fill="#eab13a" stroke="#2b211d" stroke-width="4"/></svg>Tribe Log</div>
  <div class="abs icon geo" style="left: 1110px; top: 640px"><svg width="64" height="84" viewBox="0 0 64 84"><path d="M8 18 H56 L50 80 H14 Z" fill="#fbf6e8" stroke="#2b211d" stroke-width="4"/><path d="M2 12 H62 M24 4 H40" stroke="#2b211d" stroke-width="4"/></svg>Last Wipe</div>
  <div class="abs win geo">
    <div class="title"><span>Server</span></div>
    <div class="dino bird" data-src="art/dodo.png" data-inks="ink navy teal cream white" data-gain="1.4" data-lift="0.1" data-dot-size="4" style="left:30px;top:80px;width:160px;height:160px"></div>
    <div class="body"><div class="big"><b>The server is not responding.</b></div>It may be busy, asleep, or eaten by a rex. Your progress since the last save is in the dodo's care.</div>
    <div class="btns"><span class="btn">Wait</span><span class="btn">Wait Harder</span><span class="btn def"><b>Blame Admin</b></span></div>
  </div>
</div>
<script src="ads.js"></script>
</body></html>
