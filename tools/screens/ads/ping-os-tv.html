<!doctype html>
<html><head><meta charset="utf-8"><title>Ping-O's spot</title>
<link rel="stylesheet" href="ads.css">
<script type="application/json" id="ad">{ "name": "ping-os-tv", "title": "Ping-O's: junior's ping comes down at breakfast", "type": "tv", "kind": "clip", "seconds": 12, "poster": 10 }</script>
<style>
  .ad { background: var(--ink); }
  .scene { position: absolute; inset: 0; }
  .kitchen { background: var(--cream); }
  .room { left: 0; top: 0; width: 1280px; height: 720px; }
  .screen { left: 130px; top: 190px; width: 420px; height: 250px; font-size: 76px; }
  .card { left: 50%; top: 36px; transform: translateX(-50%); background: var(--white); border: 6px solid var(--ink); border-radius: 16px; padding: 10px 36px; font-size: 54px; color: var(--navy); }
  .box { top: 150px; width: 300px; height: 420px; }
  .dodo { left: 620px; width: 300px; height: 300px; }
  .end { background: var(--mustard); }
  .logo { left: 0; width: 1280px; top: 60px; text-align: center; font-size: 230px; color: var(--tomato); line-height: 1.1; --stroke: 12px; --stroke-colour: var(--cream); }
  .tag { left: 0; width: 1280px; top: 360px; text-align: center; font-size: 72px; color: var(--navy); --shadow: var(--cream); }
  .sub { left: 0; width: 1280px; top: 470px; text-align: center; font-size: 44px; color: var(--navy); }
  .fine { left: 0; width: 1280px; top: 650px; text-align: center; font-size: 24px; color: var(--brick); }
  .star1 { left: 24px; top: 24px; width: 196px; height: 180px; background: var(--cream); }
  .star1 span { font-size: 28px; line-height: 0.92; color: var(--tomato); }
</style></head>
<body>
<div class="ad" data-w="1280" data-h="720">
  <div class="scene kitchen" id="kitchen">
    <svg class="abs room" viewBox="0 0 1280 720">
      <defs><pattern id="floor" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#f4e9cc"/><rect width="40" height="40" fill="#e0482e"/><rect x="40" y="40" width="40" height="40" fill="#e0482e"/></pattern></defs>
      <rect width="1280" height="520" fill="#9fd2c4"/>
      <rect y="520" width="1280" height="200" fill="url(#floor)"/>
      <rect x="60" y="470" width="1160" height="40" rx="8" fill="#2a8c8a" stroke="#2b211d" stroke-width="6"/>
      <rect x="100" y="150" width="480" height="320" rx="30" fill="#e9dcc0" stroke="#2b211d" stroke-width="8"/>
      <rect x="130" y="180" width="420" height="260" rx="24" fill="#213a5a" stroke="#2b211d" stroke-width="6"/>
      <path d="M260 470 L300 430 H380 L420 470" fill="#e9dcc0" stroke="#2b211d" stroke-width="6"/>
    </svg>
    <div class="abs mono screen center" id="ping"><b>999</b></div>
    <svg class="abs box offset" id="box" viewBox="0 0 270 380" style="--off: var(--navy)">
      <path d="M30 10 H250 L262 22 V372 H30 Z" fill="#e0482e" stroke="#2b211d" stroke-width="6"/>
      <path d="M250 10 V372" stroke="#2b211d" stroke-width="4"/>
      <rect x="44" y="24" width="196" height="66" rx="10" fill="#fbf6e8" stroke="#2b211d" stroke-width="4"/>
      <text x="142" y="74" text-anchor="middle" font-family="AdScript" font-size="54" fill="#e0482e" stroke="#e0482e" stroke-width="2">Ping-O's</text>
      <ellipse cx="140" cy="300" rx="94" ry="26" fill="#155a5d"/>
      <path d="M46 300 Q140 400 234 300 Z" fill="#2a8c8a" stroke="#2b211d" stroke-width="4"/>
      <g fill="none" stroke="#eab13a" stroke-width="9"><circle cx="90" cy="294" r="12"/><circle cx="122" cy="286" r="12"/><circle cx="156" cy="292" r="12"/><circle cx="188" cy="288" r="12"/><circle cx="110" cy="304" r="12"/><circle cx="172" cy="306" r="12"/></g>
      <text x="142" y="122" text-anchor="middle" font-family="AdNarrow" font-weight="700" font-size="17" fill="#fbf6e8">TOASTED OAT RINGS · 0 MS</text>
    </svg>
    <div class="dino dodo" id="dodo" data-src="art/dodo.png" data-inks="ink navy mint cream white" data-gain="1.3" data-lift="0.1"></div>
    <div class="abs cond card" id="card1">Junior's ping is through the roof!</div>
    <div class="abs cond card" id="card2">Mother knows best: Ping-O's!</div>
  </div>
  <div class="scene end" id="end">
    <svg class="rays" id="rays" data-rays="32 640 760 cream mustard" style="opacity: 0.7"></svg>
    <div class="abs script logo outline">Ping-O's</div>
    <div class="abs cent tag misreg">The zero-delay breakfast!</div>
    <div class="abs slab sub">Part of a complete 30-tick breakfast.</div>
    <div class="abs small fine">Ping-O's do not affect your ping. Neither does anything else.</div>
    <div class="abs star star1" id="star" data-star="16 0.8"><span class="cond">Now<br><b style="font-size:54px">0 ms!</b></span></div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  function frame(t) {
    // The ping climbs and shakes, then falls once the cereal is out.
    const ms = t < 4.6 ? Math.round(640 + Ad.ease(t, 0, 2.6) * 359) : Math.round(999 - Ad.ease(t, 4.6, 7.0) * 987);
    const angry = ms > 400;
    $("ping").innerHTML = `<b><span style="font-size:0.42em">PING </span>${ms}<span style="font-size:0.42em"> ms</span></b>`;
    $("ping").style.color = angry ? "#e0482e" : "#9fd2c4";
    $("ping").style.transform = angry && t > 1.5 ? `translate(${Math.sin(t * 47) * 5}px, ${Math.cos(t * 39) * 4}px)` : "";
    $("box").style.left = `${1300 - Ad.ease(t, 3.9, 4.6) * 380}px`;
    const pop = Ad.ease(t, 4.6, 5.0);
    $("dodo").style.top = `${720 - pop * 540 + Math.sin(Math.max(0, t - 5) * 6) * 6 * (t > 5 ? 1 : 0)}px`;
    $("card1").style.opacity = Ad.during(t, 0.3, 3.8);
    $("card2").style.opacity = Ad.during(t, 4.8, 7.9);
    $("kitchen").style.opacity = 1 - Ad.ease(t, 7.9, 8.2);
    $("end").style.opacity = Ad.ease(t, 7.9, 8.2);
    Ad.rays($("rays"), t * 3);
    $("star").style.transform = `rotate(${-10 + Math.sin(t * 2.5) * 6}deg) scale(${Ad.ease(t, 8.6, 9.0)})`;
  }
</script>
<script src="ads.js"></script>
</body></html>
