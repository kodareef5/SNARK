<!doctype html>
<html><head><meta charset="utf-8"><title>Raptor-Rid loop</title>
<link rel="stylesheet" href="ads.css">
<script type="application/json" id="ad">{ "name": "raptor-rid-loop", "title": "Raptor-Rid: a raptor chases a dodo across the board", "type": "billboard", "kind": "clip", "seconds": 8, "poster": 5 }</script>
<style>
  .ad { background: var(--teal); }
  .bulbs { left: 0; top: 0; width: 1280px; height: 420px; }
  .ground { left: 0; top: 330px; width: 1280px; height: 90px; background: var(--deep); }
  .head { left: 0; width: 1280px; top: 34px; font-size: 76px; color: var(--cream); text-align: center; --shadow: var(--ink); }
  .raptor { top: 70px; width: 560px; height: 280px; }
  .dodo { top: 180px; width: 170px; height: 170px; }
  .logo { left: 0; width: 1280px; top: 90px; font-size: 176px; color: var(--tomato); text-align: center; line-height: 1.1; --stroke: 10px; --stroke-colour: var(--cream); }
  .tag { left: 0; width: 1280px; top: 336px; font-size: 44px; color: var(--cream); text-align: center; }
  .star1 { left: 1040px; top: 20px; width: 200px; height: 180px; background: var(--mustard); }
  .star1 span { font-size: 54px; color: var(--tomato); }
  .dust { top: 300px; width: 60px; height: 40px; border-radius: 50%; background: var(--cream); opacity: 0.5; }
</style></head>
<body>
<div class="ad" data-w="1280" data-h="420">
  <div class="abs ground"></div>
  <div class="abs cond head misreg" id="head">Raptor in the pantry?</div>
  <div class="abs dust" id="dust1"></div><div class="abs dust" id="dust2"></div>
  <div class="abs sprite dodo" id="dodo" data-frames="art/dodo-run-%02d.png" data-count="12" data-inks="ink navy mint cream white"></div>
  <div class="abs sprite raptor offset" id="raptor" data-frames="art/raptor-run-%02d.png" data-count="17" data-inks="ink brick tomato mustard cream" data-gain="1.5" data-lift="0.12" style="--off: var(--ink)"></div>
  <div class="abs script logo outline" id="logo">Raptor-Rid!</div>
  <div class="abs slab tag" id="tag">Call before they call you.</div>
  <div class="abs star star1" id="star" data-star="16 0.78"><span class="cond">New!</span></div>
  <svg class="abs bulbs" id="bulbs" viewBox="0 0 1280 420"></svg>
</div>
<script>
  const T = 8;
  const $ = (id) => document.getElementById(id);
  // A row of bulbs round the edge; every third is lit, and the lit ones step along four times a second.
  const bulbs = [];
  const put = (x, y) => {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 7);
    $("bulbs").appendChild(c); bulbs.push(c);
  };
  for (let x = 14; x < 1280; x += 32) put(x, 12);
  for (let y = 44; y < 410; y += 32) put(1268, y);
  for (let x = 1266 - 32; x > 0; x -= 32) put(x, 408);
  for (let y = 376; y > 30; y -= 32) put(12, y);
  function frame(t) {
    t = Ad.wrap(t, T);
    const step = Math.floor(t * 4);
    bulbs.forEach((b, i) => b.setAttribute("fill", (i + step) % 3 === 0 ? "#fbf6e8" : "#155a5d"));
    // The chase crosses in the first three seconds: the dodo first, the raptor close behind.
    const x = -760 + (t / 3.4) * 2200;
    $("dodo").style.left = `${x + 600}px`;
    $("raptor").style.left = `${x}px`;
    Ad.sprite($("dodo"), t, 30);
    Ad.sprite($("raptor"), t, 30);
    [$("dust1"), $("dust2")].forEach((d, k) => {
      const age = Ad.wrap(t * 3 + k * 0.5, 1);
      d.style.left = `${x + 120 - age * 120 + k * 30}px`;
      d.style.opacity = t < 3.6 ? 0.5 * (1 - age) : 0;
      d.style.transform = `scale(${0.6 + age})`;
    });
    // The headline is up during the chase, then the logo and line take over and leave before the loop ends.
    const show = Ad.ease(t, 3.4, 3.9) * (1 - Ad.ease(t, 7.4, 7.9));
    $("head").style.opacity = 1 - show;
    $("logo").style.opacity = show;
    $("logo").style.transform = `scale(${0.6 + 0.4 * Ad.ease(t, 3.4, 4.0)})`;
    $("tag").style.opacity = Ad.ease(t, 4.0, 4.4) * (1 - Ad.ease(t, 7.4, 7.9));
    // The star turns one point in a loop and swaps inks once a second.
    $("star").style.transform = `rotate(${(t / T) * 22.5}deg)`;
    const on = Ad.blink(t, 1);
    $("star").style.background = on ? "var(--mustard)" : "var(--cream)";
  }
</script>
<script src="ads.js"></script>
</body></html>
