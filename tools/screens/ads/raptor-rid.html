<!doctype html>
<html><head><meta charset="utf-8"><title>Raptor-Rid</title>
<link rel="stylesheet" href="ads.css">
<script type="application/json" id="ad">{ "name": "raptor-rid", "title": "Raptor-Rid: kills 3 out of 5 raptors", "type": "billboard", "kind": "image" }</script>
<style>
  .ad { background: var(--teal); }
  .can { left: 18px; top: 196px; width: 112px; height: 216px; transform: rotate(-10deg); }
  .head { left: 622px; top: 22px; font-size: 60px; color: var(--cream); }
  .logo { left: 606px; top: 88px; font-size: 150px; color: var(--tomato); --stroke: 9px; --stroke-colour: var(--cream); line-height: 1.1; }
  .star1 { left: 1066px; top: 232px; width: 196px; height: 176px; background: var(--mustard); transform: rotate(-8deg); }
  .star1 span { font-size: 22px; line-height: 0.95; color: var(--ink); white-space: normal; padding-top: 6px; }
  .tag { left: 628px; top: 290px; font-size: 38px; color: var(--cream); }
  .fine { left: 630px; top: 360px; font-size: 21px; color: var(--mint); }
</style></head>
<body>
<div class="ad" data-w="1280" data-h="420">
  <svg class="rays" data-rays="22 300 470 mustard cream" style="clip-path: polygon(0 0, 600px 0, 560px 100%, 0 100%)"></svg>
  <div class="dino offset" data-src="art/raptor-pounce.png" data-inks="ink brick tomato mustard cream" data-gain="1.5" data-lift="0.12" style="left:40px;top:4px;width:600px;height:400px;--off:var(--teal)"></div>
  <svg class="abs can offset" viewBox="0 0 150 290" style="--off:var(--ink)">
    <rect x="44" y="0" width="30" height="22" rx="4" fill="#2b211d"/>
    <rect x="22" y="18" width="106" height="30" rx="10" fill="#fbf6e8" stroke="#2b211d" stroke-width="5"/>
    <rect x="14" y="44" width="122" height="236" rx="16" fill="#e0482e" stroke="#2b211d" stroke-width="6"/>
    <rect x="14" y="98" width="122" height="104" fill="#fbf6e8" stroke="#2b211d" stroke-width="5"/>
    <text x="75" y="142" text-anchor="middle" font-family="AdScript" font-size="44" fill="#e0482e" stroke="#e0482e" stroke-width="1.6">Raptor</text>
    <text x="75" y="186" text-anchor="middle" font-family="AdScript" font-size="44" fill="#2b211d" stroke="#2b211d" stroke-width="1.6">-Rid</text>
    <text x="75" y="236" text-anchor="middle" font-family="AdNarrow" font-weight="700" font-size="17" fill="#fbf6e8">EXTRA STRENGTH</text>
    <text x="75" y="258" text-anchor="middle" font-family="AdNarrow" font-weight="700" font-size="15" fill="#fbf6e8">NET WT. 1 TAME</text>
  </svg>
  <div class="abs cond head misreg" style="--shadow: var(--ink)">Raptor in the pantry?</div>
  <div class="abs script logo outline">Raptor-Rid!</div>
  <div class="abs tag slab">Spray it. Run. Repeat.</div>
  <div class="abs fine small">*The other two are now extremely upset.</div>
  <div class="abs star star1" data-star="18 0.8"><span class="cond">Kills<br><b style="font-size:42px">3 of 5</b><br>raptors!*</span></div>
</div>
<script src="ads.js"></script>
</body></html>
